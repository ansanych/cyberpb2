syntax = "proto3";
import "cyber.proto";

package cybertele;

option go_package = "./proto";

service Cyberevents {
    rpc Health (Empty) returns (HealthReply) {}
    rpc SetEvents (SetEventsRequest) returns (StatusReply) {}
    rpc GetMachineEvents (GetMachineEventsRequest) returns (EventsReply) {}
    rpc GetGroupEvents (GetGroupEventsRequest) returns (EventsReply) {}
    rpc GetGroupEventsCount (GetGroupEventsRequest) returns (EventsCount) {}
    rpc GetMachineErrorsPeriod (GetMachineErrorsPeriodRequest) returns (EventsReply) {}
    rpc GetEventTypes (Empty) returns (EventTypes) {}
}

message EventType {
    int32 id = 1;
    string code = 2;
    string label = 3;
}

message EventTypes {
    repeated EventType data = 1;
}

message EventsCount {
    int32 events = 1;
    int32 errors = 2;
}

message SetEventsRequest {
    string sn = 1;
    repeated Event events = 2;
}

message GetMachineEventsRequest {
    string sn = 1;
    string date = 2;
    int32 tz = 3;
    int64 connectionId = 4;
}

message GetGroupEventsRequest {
    repeated string sn = 1;
    string date = 2;
    int32 tz = 3;
    int64 fromId = 4;
    string direction = 5;
    int32 limit = 6;
}

// GetMachineErrorsPeriodRequest — запрос ошибок машины за период.
// from/to — даты в формате "2006-01-02" (включительно), tz — часовой пояс машины.
message GetMachineErrorsPeriodRequest {
    string sn = 1;
    string from = 2;
    string to = 3;
    int32 tz = 4;
}

message EventsReply {
    repeated Event events = 1;
}