syntax = "proto3";
package cybertele;
option go_package = "./proto";

// Status — статус компонента системы.
// При сериализации в JSON используется строковое представление (UNKNOWN, ACTIVE, INACTIVE, OK, ERROR, WARNING).
// Для корректной JSON-сериализации используйте protojson с UseEnumNumbers=false
// или кастомный MarshalJSON из пакета proto.
enum Status {
    // UNKNOWN — статус не определён
    UNKNOWN = 0;
    // ACTIVE — компонент активен
    ACTIVE = 1;
    // INACTIVE — компонент неактивен
    INACTIVE = 2;
    // OK — компонент работает нормально
    OK = 3;
    // ERROR — ошибка компонента
    ERROR = 4;
    // WARNING — предупреждение
    WARNING = 5;
}

message StatusReply {
    Status status = 1; 
}

message Empty {}

message Disk {
    float all = 1;
    float used = 2;
    float free = 3;
}

message HealthReply {
    Status postgres = 1;
    Status mongo = 2;
    Status parser = 3;
    Disk disk = 4;
}

message ParserStatus {
    Status parser = 1;
    string message = 2;
    string lastTime = 3;
}

message PageRequest {
    int32 page = 1;
    int32 limit = 2;
    string sn = 3;
}

message Pagination {
    int32 page = 1;
    int32 limit = 2;
    int32 total = 3;
}

message Machine {
    string sn = 1;
    string model = 2;
    bool sync = 3;
    int32 generationId = 4;
    int32 classId = 5;
    string className = 6;
    string generationName = 7;
    int32 modelId = 8;
    int32 maintenancePeriod = 9;
    int32 templateId = 10;
    string template = 11;
    int32 webModelId = 12;
    string webModel = 13;
}

message Machines {
    repeated Machine machines = 1;
}

message DataType {
    string code = 1;
    string name = 2;
    string meaning = 3;
    bool required = 4;
    string group = 5;
}

message DataTypes {
    repeated DataType data = 1;
}

message ModelDataTypes {
    string model = 1;
    repeated DataType dataTypes = 2;
    int32 modelId = 3;
}

message AllModelsDataTypes {
    repeated ModelDataTypes data = 1;
}

message DataPoint {
    int64 time = 1;
    float valueFloat = 2;
    int64 valueInt = 3;
}

message DataPoints {
    repeated DataPoint data = 1;
    string sn = 2;
}

message Segment {
    int64 startTime = 1;
    int64 endTime = 2;
    int64 durationSec = 3;
    float change = 4;
    float startValue = 5;
    float endValue = 6;
    string trend = 7;
}

message Segments {
    repeated Segment segments = 1;
}

message Event {
    int64 id = 1;
    string startTime = 2;
    string endTime = 3;
    string type = 4;
    string level = 5;
    string message = 6;
    string description = 7;
    float errorCode = 8;
    bool isValid = 9;
    string system = 10;
    int64 startTimeUnix = 11;
    int64 endTimeUnix = 12;
    string sn = 13;
    int64 connectionId = 14;
    int32 errorCodeInt = 15;
}

message Count {
    int32 count = 1;
}

message CyberService {
    string service = 1;
    string host = 2;
    int32 port = 3;
}

message CyberServices {
    repeated CyberService services = 1;
}

message StringRequest {
    string request = 1;
}

message TelemertyParams {
    repeated TelemertyParam params = 1;
}

message TelemertyParam {
    string code = 1;
    string label = 2;
    string units = 3;
    string description = 4;
}


message MongoRequest {
    string sn = 1;
    string machineType = 2;
    repeated float errorCode = 3;
    repeated int32 errorCodeInt = 4;
}

message MongoMachineType {
    string name = 1;
    string type = 2;
    int32 locarusProtocol = 3;
}

message MongoMachineTypes {
    repeated MongoMachineType data = 1;
}

message MongoMachine {
    string sn = 1;
    string machineType = 2;
    string imei = 3;
    bool status = 4;
    string expDate = 5;
    bool trackable = 6;
    string type = 7;
}

message MongoMachines {
    repeated MongoMachine data = 1;
}

message MongoError {
    float code = 1;
    string text = 2;
    string level = 3;
    string type = 4;
    string description = 5;
    string system = 6;
    int32 codeInt = 7;
}

message MongoErrors {
    repeated MongoError data = 1;
    string machineType = 2;
}

message MongoDataType {
    string group = 1;
    string codeName = 2;
    string fullName = 3;
    string meaning = 4;
}

message MongoDataTypes {
    repeated MongoDataType data = 1;
}

message HistoryRequest {
    string sn = 1;
    string date = 2;
}

message WorkhourItem {
    string date = 1;
    float value = 2;
}

message WorkhourHistory {
    repeated WorkhourItem data = 1;
    string sn = 2;
}

message FuelCalibrationPoint {
    int64 percent = 1;
    int64 liter = 2;
}

message FuelCalibrationType {
    int32 ID = 1;
    string name = 2;
    repeated FuelCalibrationPoint data = 3;
}

message FuelCalibration {
    int32 ID = 1;
    int32 templateID = 2;
    int32 classID = 3;
    int32 generationID = 4;
    FuelCalibrationType calibration = 5;
}

message FuelCalibrations {
    repeated FuelCalibration data = 1;
}