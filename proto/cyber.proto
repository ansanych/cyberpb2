syntax = "proto3";
package cybertele;
option go_package = "./proto";

// Status — статус компонента системы.
// При сериализации в JSON используется строковое представление (UNKNOWN, ACTIVE, INACTIVE, OK, ERROR, WARNING).
// Для корректной JSON-сериализации используйте protojson с UseEnumNumbers=false
// или кастомный MarshalJSON из пакета proto.
enum Status {
    // UNKNOWN — статус не определён
    UNKNOWN = 0;
    // ACTIVE — компонент активен
    ACTIVE = 1;
    // INACTIVE — компонент неактивен
    INACTIVE = 2;
    // OK — компонент работает нормально
    OK = 3;
    // ERROR — ошибка компонента
    ERROR = 4;
    // WARNING — предупреждение
    WARNING = 5;
}

message StatusReply {
    Status status = 1; 
}

message Empty {}

message Disk {
    float all = 1;
    float used = 2;
    float free = 3;
}

message HealthReply {
    Status postgres = 1;
    Status mongo = 2;
    Status parser = 3;
    Disk disk = 4;
    Status aggregator = 5;
    repeated string required = 6;
}

message ParserStatus {
    Status parser = 1;
    string message = 2;
    string lastTime = 3;
}

message PageRequest {
    int32 page = 1;
    int32 limit = 2;
    string sn = 3;
}

message Pagination {
    int32 page = 1;
    int32 limit = 2;
    int32 total = 3;
}

message Machine {
    string sn = 1;
    string model = 2;
    bool sync = 3;
    int32 generationId = 4;
    int32 classId = 5;
    string className = 6;
    string generationName = 7;
    int32 modelId = 8;
    int32 maintenancePeriod = 9;
    int32 templateId = 10;
    string template = 11;
    int32 webModelId = 12;
    string webModel = 13;
    // Полная карточка машины (GetMachinesFull): данные из dst_machines и warranty.
    string imei = 14;
    string expDate = 15;
    bool active = 16;
    string type = 17;
    string machineType = 18;
    bool trackable = 19;
    MachineWarranty warranty = 20;
}

message MachineWarranty {
    int32 id = 1;
    int32 hours = 2;
    int32 months = 3;
}

message Machines {
    repeated Machine machines = 1;
}

message DataType {
    string code = 1;
    string name = 2;
    string meaning = 3;
    bool required = 4;
    string group = 5;
}

message DataTypes {
    repeated DataType data = 1;
}

message ModelDataTypes {
    string model = 1;
    repeated DataType dataTypes = 2;
    int32 modelId = 3;
}

message AllModelsDataTypes {
    repeated ModelDataTypes data = 1;
}

message DataPoint {
    int64 time = 1;
    float valueFloat = 2;
    int64 valueInt = 3;
}

message DataPoints {
    repeated DataPoint data = 1;
    string sn = 2;
}

message Segment {
    int64 startTime = 1;
    int64 endTime = 2;
    int64 durationSec = 3;
    float change = 4;
    float startValue = 5;
    float endValue = 6;
    string trend = 7;
}

message Segments {
    repeated Segment segments = 1;
}

message Event {
    int64 id = 1;
    string startTime = 2;
    string endTime = 3;
    string type = 4;
    string level = 5;
    string message = 6;
    string description = 7;
    float errorCode = 8;
    bool isValid = 9;
    string system = 10;
    int64 startTimeUnix = 11;
    int64 endTimeUnix = 12;
    string sn = 13;
    int64 connectionId = 14;
    int32 errorCodeInt = 15;
}

message Count {
    int32 count = 1;
}

message CyberService {
    string service = 1;
    string host = 2;
    int32 port = 3;
}

message CyberServices {
    repeated CyberService services = 1;
}

message StringRequest {
    string request = 1;
}

message TelemertyParams {
    repeated TelemertyParam params = 1;
}

message TelemertyParam {
    string code = 1;
    string label = 2;
    string units = 3;
    string description = 4;
    int32 id = 5;
}


message MongoRequest {
    string sn = 1;
    string machineType = 2;
    repeated float errorCode = 3;
    repeated int32 errorCodeInt = 4;
}

message MongoMachineType {
    string name = 1;
    string type = 2;
    int32 locarusProtocol = 3;
}

message MongoMachineTypes {
    repeated MongoMachineType data = 1;
}

message MongoMachine {
    string sn = 1;
    string machineType = 2;
    string imei = 3;
    bool status = 4;
    string expDate = 5;
    bool trackable = 6;
    string type = 7;
}

message MongoMachines {
    repeated MongoMachine data = 1;
}

message MongoError {
    float code = 1;
    string text = 2;
    string level = 3;
    string type = 4;
    string description = 5;
    string system = 6;
    int32 codeInt = 7;
}

message MongoErrors {
    repeated MongoError data = 1;
    string machineType = 2;
}

message MongoDataType {
    string group = 1;
    string codeName = 2;
    string fullName = 3;
    string meaning = 4;
}

message MongoDataTypes {
    repeated MongoDataType data = 1;
}

message HistoryRequest {
    string sn = 1;
    string date = 2;
}

message WorkhourItem {
    string date = 1;
    float value = 2;
}

message WorkhourHistory {
    repeated WorkhourItem data = 1;
    string sn = 2;
}

message FuelCalibrationPoint {
    int64 percent = 1;
    int64 liter = 2;
}

message FuelCalibrationType {
    int32 ID = 1;
    string name = 2;
    repeated FuelCalibrationPoint data = 3;
}

message FuelCalibrationTypes {
    repeated FuelCalibrationType types = 1;
}

message FuelCalibration {
    int32 ID = 1;
    int32 templateID = 2;
    int32 classID = 3;
    int32 generationID = 4;
    FuelCalibrationType calibration = 5;
    string comment = 6;
}

message FuelCalibrations {
    repeated FuelCalibration data = 1;
}

message FuelCalibrationMatching {
    int32 templateID = 1;
    string templateName = 2;
    int32 classID = 3;
    string className = 4;
    int32 generationID = 5;
    string generationName = 6;
    int64 machinesCount = 7;
    int64 modelsCount = 8;
    repeated string models = 9;
    FuelCalibrationType calibration = 10;
    string comment = 11;
}

message FuelCalibrationMatchings {
    repeated FuelCalibrationMatching data = 1;
}

message TelemetryParamsSet {
    int32 ID = 1;
    string name = 2;
}

message TelemetryParamsSets {
    repeated TelemetryParamsSet data = 1;
}

message TelemetryParamsSetValueType {
    int32 ID = 1;
    string code = 2;
    string name = 3;
}

message TelemetryParamsSetValueTypes {
    repeated TelemetryParamsSetValueType data = 1;
}

message TelemetryParamsSetValue {
    int32 ID = 1;
    int32 setID = 2;
    int32 telemetryParamID = 3;
    string telemetryParamCode = 4;
    bool required = 5;
    int32 valueTypeID = 6;
    string valueTypeCode = 7;
    double value = 8;
}

message TelemetryParamsSetValues {
    repeated TelemetryParamsSetValue data = 1;
}

message TelemetryParamsSetValuesRequest {
    int32 setID = 1;
}

message TelemetryParamsSetMatching {
    int32 templateID = 1;
    string templateName = 2;
    int32 classID = 3;
    string className = 4;
    int32 generationID = 5;
    string generationName = 6;
    int64 machinesCount = 7;
    int64 modelsCount = 8;
    repeated string models = 9;
    TelemetryParamsSet set = 10;
    string comment = 11;
}

message TelemetryParamsSetMatchings {
    repeated TelemetryParamsSetMatching data = 1;
}

// analysis event rules

message AnalysisConstant {
    int32 ID = 1;
    string code = 2;
    string name = 3;
    double value = 4;
    string units = 5;
    string description = 6;
    string updatedAt = 7;
}

message AnalysisConstants {
    repeated AnalysisConstant data = 1;
}

message AnalysisEventGroup {
    int32 ID = 1;
    string logic = 2; // and | or
    string label = 3;
    int32 sortOrder = 4;
}

message AnalysisEventCondition {
    int32 ID = 1;
    int32 groupID = 2;
    string kind = 3; // telemetry | operjob | digital
    string telemetryParamCode = 4;
    string digitalCode = 5;
    string operator = 6; // lt | lte | gt | gte | eq | neq
    string thresholdSource = 7; // set_value_type | constant | literal | param | none
    string valueTypeCode = 8;
    string constantCode = 9;
    string compareParamCode = 10;
    double literalValue = 11;
    int32 sortOrder = 12;
}

message AnalysisEventLevel {
    int32 ID = 1;
    string code = 2;
    string label = 3;
    double thresholdPercent = 4;
    int32 sortOrder = 5;
}

// AnalysisEventImportanceLevel — справочник важности самого события.
// Код важности хранится в AnalysisEvent.level и не связан с пороговыми
// уровнями фиксации (AnalysisEventLevel).
message AnalysisEventImportanceLevel {
    int32 ID = 1;
    string code = 2;
    string label = 3;
    int32 sortOrder = 4;
}

message AnalysisEventImportanceLevels {
    repeated AnalysisEventImportanceLevel data = 1;
}

// AnalysisCriticalityLevel — справочник допустимых кодов уровней
// критичности, из которого события выбирают код в analysis_event_levels.
message AnalysisCriticalityLevel {
    int32 ID = 1;
    string code = 2;
    string label = 3;
    int32 sortOrder = 4;
}

message AnalysisCriticalityLevels {
    repeated AnalysisCriticalityLevel data = 1;
}

message AnalysisEvent {
    int32 ID = 1;
    string code = 2;
    string label = 3;
    string description = 4;
    string level = 5;
    string percentBase = 6;
    string messageText = 7;
    string systemName = 8;
    bool enabled = 9;
    string updatedAt = 10;
    repeated AnalysisEventGroup groups = 11;
    repeated AnalysisEventCondition conditions = 12;
    repeated AnalysisEventLevel levels = 13;
}

message AnalysisEvents {
    repeated AnalysisEvent data = 1;
}

message AnalysisEventRules {
    repeated AnalysisEvent events = 1;
    repeated AnalysisConstant constants = 2;
}

message DigitalParam {
    string code = 1;
    string fullname = 2;
    string meaning = 3;
}

message DigitalParams {
    repeated DigitalParam params = 1;
}

message EventBlock {
    int64 start = 1;
    int64 end = 2;
    float value = 3;
    int64 id = 4;
}