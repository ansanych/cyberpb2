syntax = "proto3";
import "cyber.proto";

package cybertele;

option go_package = "./proto";

service Info {
    rpc Health (Empty) returns (HealthReply) {}
    rpc GetMachines (Empty) returns (Machines) {}
    rpc GetMachinesFull (Empty) returns (Machines) {}
    rpc GetTelemetryParams (Empty) returns (TelemertyParams) {}
    rpc GetMongoMachineTypes (Empty) returns (MongoMachineTypes) {}
    rpc GetMongoMachines (MongoRequest) returns (MongoMachines) {}
    rpc GetMongoErrors (MongoRequest) returns (MongoErrors) {}
    rpc GetMongoDataTypes (Empty) returns (MongoDataTypes) {}
    rpc GetMongoAllErrors (MongoRequest) returns (MongoErrors) {}
    rpc GetFuelCalibrations (Empty) returns (FuelCalibrations) {}
    rpc SetFuelCalibration(FuelCalibration)returns(StatusReply){}
    rpc UpdateFuelCalibration(FuelCalibration)returns(StatusReply){}
    rpc DeleteFuelCalibration(FuelCalibration)returns(StatusReply){}
    rpc GetFuelCalibrationTypes(Empty) returns(FuelCalibrationTypes) {}
    rpc SetFuelCalibrationType(FuelCalibrationType) returns(StatusReply) {}
    rpc UpdateFuelCalibrationType(FuelCalibrationType) returns(StatusReply) {}
    rpc DeleteFuelCalibrationType(FuelCalibrationType) returns(StatusReply) {}
    rpc GetFuelCalibrationMatchings(Empty) returns(FuelCalibrationMatchings) {}
}